<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="buzzclips-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#a855f7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background squircle with margin for Google's circular crop -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="112"
    ry="112"
    fill="url(#buzzclips-gradient)"
  />

  <!-- Crisp white centered Play triangle -->
  <polygon
    points="200,144 360,256 200,368"
    fill="#ffffff"
  />
</svg>
